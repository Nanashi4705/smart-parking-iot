; PlatformIO Project Configuration for Smart Parking IoT
; 2x ESP32 DevKit (gateway, gate) + 2x ESP8266 NodeMCU (floor1, floor2)
; Build all 4 environments: pio run
; Upload specific board: pio run -e <gateway|floor1|floor2|gate> -t upload

[platformio]
default_envs = gateway, floor1, floor2, gate

[env]
framework = arduino
monitor_speed = 115200
build_flags =
  -I include

[env:gateway]
platform = espressif32@6.9.0
board = esp32dev
build_src_filter = +<gateway/*>
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.1

[env:floor1]
platform = espressif8266@4.2.1
board = nodemcuv2
build_src_filter = +<floor/*>
build_flags =
  ${env.build_flags}
  -DFLOOR_ID=1

[env:floor2]
platform = espressif8266@4.2.1
board = nodemcuv2
build_src_filter = +<floor/*>
build_flags =
  ${env.build_flags}
  -DFLOOR_ID=2

[env:gate]
platform = espressif32@6.9.0
board = esp32dev
build_src_filter = +<gate/*>
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  miguelbalboa/MFRC522@^1.4.11
  madhephaestus/ESP32Servo@^3.0.5
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.13
